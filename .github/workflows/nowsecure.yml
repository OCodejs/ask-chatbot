name: NowSecure

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  nowsecure:
    runs-on: ubuntu-latest
    steps:
      - name: Check mobile project and NowSecure credentials
        id: readiness
        env:
          NS_TOKEN: ${{ secrets.NS_TOKEN }}
          NOWSECURE_GROUP_ID: ${{ vars.NOWSECURE_GROUP_ID }}
        run: |
          if [ -f ./gradlew ] && [ -n "$NS_TOKEN" ] && [ -n "$NOWSECURE_GROUP_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NowSecure skipped: this repository has no Gradle wrapper or the NS_TOKEN/NOWSECURE_GROUP_ID settings are missing."
          fi

      - name: Checkout code
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build Android application
        if: steps.readiness.outputs.ready == 'true'
        run: ./gradlew assembleDebug

      - name: Run NowSecure
        if: steps.readiness.outputs.ready == 'true' && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: nowsecure/nowsecure-action@3b439db31b6dce857b09f5222fd13ffc3159ad26
        with:
          token: ${{ secrets.NS_TOKEN }}
          app_file: app/build/outputs/apk/debug/app-debug.apk
          group_id: ${{ vars.NOWSECURE_GROUP_ID }}

      - name: Upload SARIF file
        if: always() && hashFiles('NowSecure.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: NowSecure.sarif
