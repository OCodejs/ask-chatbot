# Microsoft Security DevOps (MSDO) scans the repository on pushes, pull requests,
# and the weekly schedule. The repository must also be onboarded in Microsoft Defender
# for DevOps for results to appear in Azure.

name: "Microsoft Defender For Devops"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "37 0 * * 5"

permissions:
  contents: read

jobs:
  MSDO:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            5.0.x
            6.0.x
      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1.6.0
        id: msdo
      - name: Verify Microsoft Security DevOps report
        if: success()
        env:
          SARIF_FILE: ${{ steps.msdo.outputs.sarifFile }}
        run: |
          if (-not $env:SARIF_FILE -or -not (Test-Path -LiteralPath $env:SARIF_FILE -PathType Leaf)) {
            throw "Microsoft Security DevOps did not produce a SARIF report."
          }
      - name: Upload results to Security tab
        if: >-
          always() &&
          steps.msdo.outputs.sarifFile != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
