name: NeuraLegion

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "34 12 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neuralegion_scan:
    name: Nexploit DAST scan
    runs-on: ubuntu-latest
    steps:
      - name: Check Nexploit token and authorized target
        id: readiness
        env:
          NEXPLOIT_TOKEN: ${{ secrets.NEURALEGION_TOKEN }}
          NEXPLOIT_TARGET_URL: ${{ vars.NEXPLOIT_TARGET_URL }}
        run: |
          if [ -n "$NEXPLOIT_TOKEN" ] && [ -n "$NEXPLOIT_TARGET_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nexploit scan skipped: configure NEURALEGION_TOKEN and NEXPLOIT_TARGET_URL for a target you own or are authorized to test."
          fi

      - name: Start Nexploit Scan
        if: steps.readiness.outputs.ready == 'true'
        id: start
        uses: NeuraLegion/run-scan@29ebd17b4fd6292ce7a238a59401668953b37fbe
        with:
          api_token: ${{ secrets.NEURALEGION_TOKEN }}
          name: OCodeJS scan ${{ github.sha }}
          discovery_types: |
            [ "crawler" ]
          crawler_urls: |
            [ "${{ vars.NEXPLOIT_TARGET_URL }}" ]

      - name: Print scan URL
        if: steps.readiness.outputs.ready == 'true'
        run: echo "Nexploit scan started: ${{ steps.start.outputs.url }}"
