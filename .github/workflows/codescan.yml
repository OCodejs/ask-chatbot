name: CodeScan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CodeScan:
    runs-on: ubuntu-latest
    steps:
      - name: Explain CodeScan scanner compatibility block
        run: |
          echo "::warning::CodeScan automation is paused. The current CodeScan GitHub Action bundles SonarScanner CLI 4.4.0, which starts Java 11; the current CodeScan server scanner engine requires Java 17 (class-file version 61). The workflow will be re-enabled after the upstream action ships a Java 17-compatible scanner."
          echo "Alternative security coverage remains active through CodeQL, OSSAR, Trivy, Codacy, OSV-Scanner, MobSF and PHPMD."
