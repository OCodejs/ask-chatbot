name: NowSecure Mobile SBOM

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "37 20 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nowsecure:
    runs-on: ubuntu-latest
    steps:
      - name: Check mobile project and NowSecure credentials
        id: readiness
        env:
          NS_TOKEN: ${{ secrets.NS_TOKEN }}
          NOWSECURE_GROUP_ID: ${{ vars.NOWSECURE_GROUP_ID }}
        run: |
          if [ -f ./gradlew ] && [ -n "$NS_TOKEN" ] && [ -n "$NOWSECURE_GROUP_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NowSecure SBOM skipped: this repository has no Gradle wrapper or the NS_TOKEN/NOWSECURE_GROUP_ID settings are missing."
          fi

      - name: Checkout code
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build Android application
        if: steps.readiness.outputs.ready == 'true'
        run: ./gradlew assembleDebug

      - name: Upload mobile SBOM
        if: steps.readiness.outputs.ready == 'true' && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: nowsecure/nowsecure-sbom-action@ecb731b6f17a83fa53f756f9dae2ec7034c5ed7c
        with:
          token: ${{ secrets.NS_TOKEN }}
          app_file: app/build/outputs/apk/debug/app-debug.apk
          group_id: ${{ vars.NOWSECURE_GROUP_ID }}
