name: Veracode Static Analysis Pipeline Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 11 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-pipeline-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Check Veracode credentials
        id: credentials
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
        run: |
          if [ -n "$VERACODE_API_ID" ] && [ -n "$VERACODE_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Veracode scan skipped: configure VERACODE_API_ID and VERACODE_API_KEY repository secrets."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.credentials.outputs.configured == 'true'

      - name: Package source
        if: steps.credentials.outputs.configured == 'true'
        run: zip -r veracode-scan-target.zip ./

      - name: Download Veracode Pipeline Scan
        if: steps.credentials.outputs.configured == 'true'
        run: |
          curl --silent --show-error --fail -O https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -o pipeline-scan-LATEST.zip

      - name: Set up Java
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Run Veracode Pipeline Scan
        if: steps.credentials.outputs.configured == 'true'
        run: java -jar pipeline-scan.jar --veracode_api_id "$VERACODE_API_ID" --veracode_api_key "$VERACODE_API_KEY" --fail_on_severity="Very High, High" --file veracode-scan-target.zip
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
        continue-on-error: true

      - name: Convert pipeline scan output to SARIF
        if: steps.credentials.outputs.configured == 'true' && hashFiles('results.json') != ''
        uses: veracode/veracode-pipeline-scan-results-to-sarif@ff08ae5b45d5384cb4679932f184c013d34da9be
        with:
          pipeline-results-json: results.json
          output-results-sarif: veracode-results.sarif

      - name: Upload Veracode results
        if: steps.credentials.outputs.configured == 'true' && hashFiles('veracode-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: veracode-results.sarif
