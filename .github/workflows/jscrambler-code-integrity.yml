name: Jscrambler Code Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JSCRAMBLER_APPLICATION_ID: ${{ secrets.JSCRAMBLER_APPLICATION_ID }}
      JSCRAMBLER_SECRET_KEY: ${{ secrets.JSCRAMBLER_SECRET_KEY }}
      JSCRAMBLER_ACCESS_KEY: ${{ secrets.JSCRAMBLER_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Jscrambler Code Integrity
        if: ${{ hashFiles('jscrambler.json') != '' && env.JSCRAMBLER_APPLICATION_ID != '' && env.JSCRAMBLER_SECRET_KEY != '' && env.JSCRAMBLER_ACCESS_KEY != '' }}
        uses: jscrambler/code-integrity-actions/protect@ab65962a2ecffcc362b75a997e24a181d0bde5fb
        with:
          application-id: ${{ secrets.JSCRAMBLER_APPLICATION_ID }}
          secret-key: ${{ secrets.JSCRAMBLER_SECRET_KEY }}
          access-key: ${{ secrets.JSCRAMBLER_ACCESS_KEY }}
          jscrambler-config-path: jscrambler.json
          files-src: |
            dist/**/*
          files-dest: .
      - name: Explain skipped Jscrambler protection
        if: ${{ hashFiles('jscrambler.json') == '' || env.JSCRAMBLER_APPLICATION_ID == '' || env.JSCRAMBLER_SECRET_KEY == '' || env.JSCRAMBLER_ACCESS_KEY == '' }}
        run: echo "Jscrambler protection skipped: jscrambler.json and all three Jscrambler repository secrets are required."