name: Hugging Face Space Python smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - "huggingface-space-kimi-demo/**"
      - ".github/workflows/huggingface-space-python.yml"
  push:
    branches: ["main"]
    paths:
      - "huggingface-space-kimi-demo/**"
      - ".github/workflows/huggingface-space-python.yml"

permissions:
  contents: read

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out the code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: huggingface-space-kimi-demo/requirements.txt
      - name: Install Space requirements
        working-directory: huggingface-space-kimi-demo
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate imports and security floors
        working-directory: huggingface-space-kimi-demo
        run: |
          python -m compileall -q app.py
          python - <<'PY'
          from importlib.metadata import version
          from packaging.version import Version
          import gradio
          from huggingface_hub import InferenceClient

          assert Version(version("httpx2")) >= Version("2.12.0")
          assert Version(version("httpcore2")) >= Version("2.12.0")
          assert gradio is not None and InferenceClient is not None
          print({
              "gradio": version("gradio"),
              "huggingface-hub": version("huggingface-hub"),
              "httpx2": version("httpx2"),
              "httpcore2": version("httpcore2"),
          })
          PY
