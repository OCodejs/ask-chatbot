name: APIsec

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "24 15 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Trigger_APIsec_scan:
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check APIsec credentials
        id: credentials
        env:
          APISEC_USERNAME: ${{ secrets.apisec_username }}
          APISEC_PASSWORD: ${{ secrets.apisec_password }}
        run: |
          if [ -n "$APISEC_USERNAME" ] && [ -n "$APISEC_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APIsec scan skipped: configure repository secrets apisec_username and apisec_password to enable this integration."
          fi

      - name: APIsec scan
        if: steps.credentials.outputs.configured == 'true'
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          apisec-project: "VAmPI"
          sarif-result-file: "apisec-results.sarif"

      - name: Import results
        if: steps.credentials.outputs.configured == 'true' && hashFiles('apisec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: apisec-results.sarif
